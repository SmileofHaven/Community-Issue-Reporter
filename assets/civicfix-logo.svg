  <rect x="36" y="26" width="6" height="14" fill="#ffffff" opacity=".55"/>
  <rect x="44" y="26" width="6" height="14" fill="#ffffff" opacity=".85"/>
  <path d="M30 22h4v20h-4z" fill="#1d4ed8"/>
  <path d="M28 42h8v2h-8z" fill="#1d4ed8"/>
